<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6a7a" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dks2psaem/image/upload/w_192,h_192,c_pad,b_white/v1763347986/joscm-logo_jq0zlo.png" />
    <title>JOSCM Tithes App</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of
      // the wrong theme. Mirrors src/context/ThemeContext.jsx.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
